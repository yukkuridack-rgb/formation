<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フォーメーションエディタ</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#1d2433;--sub:#6b7488;--line:#dfe3ee;--stage:#fdfdff;--grid:#e6e9f3;--accent:#6c5ce7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--panel:#1c202c;--text:#e8ebf5;--sub:#8e97ad;--line:#2d3345;--stage:#171a24;--grid:#262b3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--panel:#1c202c;--text:#e8ebf5;--sub:#8e97ad;--line:#2d3345;--stage:#171a24;--grid:#262b3b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
h1{font-size:17px;margin:0;margin-right:auto}
h1 span{color:var(--accent)}
button,input,select{font:inherit;color:var(--text)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.sm{padding:2px 8px;font-size:12px}
input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:100%}
main{display:grid;grid-template-columns:1fr 250px;gap:12px;padding:0 14px 14px}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
#stageWrap{touch-action:none}
svg#stage{width:100%;height:auto;display:block;background:var(--stage);border-radius:8px;user-select:none}
.dancer{cursor:grab}
.dancer text{pointer-events:none;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.bar input[type=range]{flex:1;min-width:120px}
label.chk{display:flex;gap:4px;align-items:center;color:var(--sub);font-size:13px}
#dl{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:340px;overflow:auto}
.dr{display:grid;grid-template-columns:28px 1fr 26px;gap:6px;align-items:center}
.dr input[type=color]{width:28px;height:28px;border:none;padding:0;background:none;cursor:pointer}
.h{font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
#strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px}
.fc{flex:0 0 150px;border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:var(--panel)}
.fc.on{border-color:var(--accent)}
.fc svg{width:100%;display:block;background:var(--stage);border-radius:6px}
.fc .r{display:flex;gap:4px;align-items:center;margin-top:4px;font-size:12px;color:var(--sub)}
.fc input{padding:2px 5px;font-size:12px}
.fc input[type=number]{width:62px}
.hint{color:var(--sub);font-size:12px;margin:6px 0 0}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
#ov .box{background:var(--panel);border-radius:12px;padding:12px;max-width:min(900px,100%);max-height:100%;overflow:auto}
#ov img{max-width:100%;display:block;border-radius:6px;background:#fff}
</style>
</head>
<body>
<header>
  <h1><span>●</span> フォーメーションエディタ</h1>
  <select id="preset" title="並びを一括設定">
    <option value="">配置プリセット…</option>
    <option value="line">横一列</option><option value="two">二列</option>
    <option value="v">V字</option><option value="vrev">逆V字（山型）</option><option value="circle">円</option><option value="diag">斜め</option><option value="diagR">斜め（逆）</option><option value="tri">三角形</option><option value="tri2">逆三角形</option><option value="block">3列ブロック</option><option value="stag">千鳥2列</option><option value="arc">弧（U字）</option><option value="arc2">弧（逆U字）</option><option value="center">センター＋円</option><option value="diamond">ダイヤ</option><option value="wave">ウェーブ</option><option value="zig">ジグザグ</option><option value="col">縦一列</option><option value="split">左右2列</option><option value="flipx">↔ 左右反転</option><option value="flipy">↕ 前後反転</option>
  </select>
  <button id="imgB">🖼 この隊形を画像に</button>
  <button id="imgA">🖼 全隊形をシートに</button>
  <button id="exp">データ書き出し</button>
  <button id="imp">読み込み</button>
  <button id="theme">🌓</button>
</header>
<main>
  <section class="card">
    <div id="stageWrap"><svg id="stage" viewBox="0 0 1000 620"></svg></div>
    <div class="bar">
      <button id="play" class="pri">▶ 再生</button>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="tl" style="color:var(--sub);min-width:84px;text-align:right">0.0s</span>
    </div>
    <div class="bar">
      <button id="aBtn">🎵 音源を選ぶ</button><input type="file" id="aFile" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" hidden><span id="aName" class="hint" style="margin:0">音源なし</span>
      <label class="chk"><input type="checkbox" id="snap" checked>グリッドにスナップ</label>
      <label class="chk"><input type="checkbox" id="ghost" checked>前の隊形を表示</label>
      <label class="chk"><input type="checkbox" id="nums">番号表示</label>
    </div>
    <p class="hint">立ち位置をドラッグして動かせます。下の隊形カードで時間を設定すると、再生時に隊形間をなめらかに移動します。</p>
  </section>
  <aside class="card">
    <div class="h">メンバー <button class="sm" id="addD">＋追加</button></div>
    <div id="dl"></div>
  </aside>
</main>
<section class="card" style="margin:0 14px 14px">
  <div class="h">隊形 <span><button class="sm" id="addHere" title="再生を止めた位置に、その瞬間の立ち位置で隊形を追加">📍 現在位置に追加</button> <button class="sm" id="addF">＋新規</button> <button class="sm" id="dupF">複製</button> <button class="sm" id="delF">削除</button></span></div>
  <div id="strip"></div>
</section>

<div id="ov"><div class="box"><img id="ovImg" alt=""><p id="ovMsg" class="hint">画像を長押し（右クリック）でも保存できます</p><div class="bar"><button class="pri" id="ovSave">画像を保存</button><button id="ovClose">閉じる</button></div></div></div>
<script>
(function(){
var W=1000,H=620,GRID=40,MARGIN=40,KEY="formation-editor-v2";
var COLORS=["#e74c3c","#f39c12","#27ae60","#2980b9","#8e44ad","#e84393","#16a085","#d35400","#34495e","#6c5ce7"];
var S={dancers:[],forms:[],cur:0,time:0,playing:false};
var $=function(i){return document.getElementById(i)};
var svg=$("stage"),NS="http://www.w3.org/2000/svg";
var uid=0,drag=null,raf=null,t0=0,au={ctx:null,buf:null,src:null,on:false,base:0,dur:0},ov={};

function nid(){return "d"+(++uid)+Math.floor(Math.random()*1e4)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({dancers:S.dancers,forms:S.forms,cur:S.cur}))}catch(e){}}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY));if(j&&j.dancers&&j.forms){S.dancers=j.dancers;S.forms=j.forms;S.cur=j.cur||0;return true}}catch(e){}return false}

function layoutNew(k,n){
  var o=[],i,d,a,c,s,cx=W/2,cy=H/2;
  function rows(cn,flip){var r=cn.length,out=[];cn.forEach(function(m,q){var y=cy+(q-(r-1)/2)*110*(flip?-1:1);for(var j=0;j<m;j++)out.push({x:cx+(j-(m-1)/2)*120+(r===2&&q===1&&m===cn[0]?60:0),y:y})});return out}
  var T={3:[1,2],4:[1,3],5:[1,2,2],6:[1,2,3],7:[1,2,4],8:[1,3,4],9:[1,2,3,3],10:[1,2,3,4]};
  if(k==="tri"||k==="tri2")return T[n]?rows(T[n],k==="tri2"):null;
  if(k==="block"){var b=Math.floor(n/3),r=n%3,cn=[b,b,b];if(r>=1)cn[1]++;if(r===2)cn[0]++;return rows(cn.filter(function(v){return v>0}))}
  if(k==="stag"){var a1=Math.ceil(n/2);return rows([a1,n-a1])}
  for(i=0;i<n;i++){
    d=i-(n-1)/2;a=2*Math.PI*i/n-Math.PI/2;c=Math.cos(a);s=Math.sin(a);
    if(k==="vrev")o.push({x:cx+d*110,y:cy-100+Math.abs(d)*60});
    else if(k==="arc"||k==="arc2"){var t=(n>1?-1+2*i/(n-1):0);var e=(1-Math.cos(t))*330;o.push({x:cx+Math.sin(t)*330,y:k==="arc"?cy-120+e:cy+120-e})}
    else if(k==="center"){if(i===0)o.push({x:cx,y:cy});else{a=2*Math.PI*(i-1)/(n-1)-Math.PI/2;o.push({x:cx+Math.cos(a)*220,y:cy+Math.sin(a)*190})}}
    else if(k==="diamond"){var kk=1/(Math.abs(c)+Math.abs(s));o.push({x:cx+c*kk*260,y:cy+s*kk*210})}
    else if(k==="wave")o.push({x:W*(i+1)/(n+1),y:cy+Math.sin(i*1.1)*90});
    else if(k==="zig")o.push({x:W*(i+1)/(n+1),y:cy+(i%2?60:-60)});
    else if(k==="diagR")o.push({x:W*(i+1)/(n+1),y:H*(n-i)/(n+1)});
    else if(k==="col")o.push({x:cx,y:H*(i+1)/(n+1)});
    else if(k==="split"){var L=Math.ceil(n/2),lf=i<L,gi=lf?i:i-L,gm=lf?L:n-L;o.push({x:lf?270:730,y:cy+(gi-(gm-1)/2)*95})}
    else return null;
  }
  return o;
}
function layout(kind,n){
  var P=layoutNew(kind,n);if(P)return P;
  var out=[],i,cx=W/2,cy=H/2;
  for(i=0;i<n;i++){
    var x,y;
    if(kind==="line"){x=W*(i+1)/(n+1);y=cy}
    else if(kind==="two"){var h=Math.ceil(n/2);var r=i<h?0:1;var k=r?i-h:i;var m=r?n-h:h;x=W*(k+1)/(m+1);y=r?cy+90:cy-90}
    else if(kind==="v"){var d=i-(n-1)/2;x=cx+d*90;y=cy-130+Math.abs(d)*-1*0+Math.abs(d)*60;y=cy+100-Math.abs(d)*60}
    else if(kind==="circle"){var a=Math.PI*2*i/n-Math.PI/2;x=cx+Math.cos(a)*200;y=cy+Math.sin(a)*200}
    else{x=W*(i+1)/(n+1);y=H*(i+1)/(n+1)}
    out.push({x:x,y:y});
  }
  return out;
}
function snapV(v){return Math.round(v/GRID)*GRID}
function init(){
  if(load()){uid=S.dancers.length+50;return}
  for(var i=0;i<7;i++)S.dancers.push({id:nid(),name:"メンバー"+(i+1),color:COLORS[i%COLORS.length]});
  var p=layout("line",7),pos={};
  S.dancers.forEach(function(d,i){pos[d.id]={x:snapV(p[i].x),y:snapV(p[i].y)}});
  S.forms.push({name:"イントロ",t:0,pos:pos});
}
function ease(u){return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2}
function total(){return Math.max(1,S.forms[S.forms.length-1].t,au.dur)}
function posAt(time){
  var f=S.forms,i=0,res={};
  while(i<f.length-1&&time>=f[i+1].t)i++;
  var a=f[i],b=f[i+1];
  var k=0;
  if(b){var gap=b.t-a.t,mv=Math.min(1.5,gap),st=b.t-mv;k=time<=st?0:ease(Math.min(1,(time-st)/mv))}
  S.dancers.forEach(function(d){
    var p=a.pos[d.id]||{x:W/2,y:H/2},q=b&&b.pos[d.id]||p;
    res[d.id]={x:p.x+(q.x-p.x)*k,y:p.y+(q.y-p.y)*k};
  });
  return {pos:res,idx:i};
}
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

function drawStage(){
  svg.innerHTML="";
  var g,x,y;
  for(x=0;x<=W;x+=GRID)el("line",{x1:x,y1:0,x2:x,y2:H,stroke:"var(--grid)","stroke-width":x%200===0?2:1},svg);
  for(y=0;y<=H;y+=GRID)el("line",{x1:0,y1:y,x2:W,y2:y,stroke:"var(--grid)","stroke-width":y%200===0?2:1},svg);
  el("line",{x1:W/2,y1:0,x2:W/2,y2:H,stroke:"var(--accent)","stroke-opacity":.35,"stroke-dasharray":"6 6"},svg);
  var t=el("text",{x:W/2,y:H-8,"text-anchor":"middle","font-size":16,fill:"var(--sub)"},svg);t.textContent="▼ 客席（フロント） ▼";
  var live=S.playing||S.scrub;
  var cur=live?posAt(S.time).pos:S.forms[S.cur].pos;
  if(!live&&$("ghost").checked&&S.cur>0){
    var pv=S.forms[S.cur-1].pos;
    S.dancers.forEach(function(d){var p=pv[d.id];if(!p)return;el("circle",{cx:p.x,cy:p.y,r:24,fill:"none",stroke:d.color,"stroke-width":2,"stroke-dasharray":"4 4",opacity:.55},svg)});
  }
  S.dancers.forEach(function(d,i){
    var p=cur[d.id];if(!p)return;
    g=el("g",{"class":"dancer",transform:"translate("+p.x+","+p.y+")","data-id":d.id},svg);
    el("circle",{r:26,fill:d.color,stroke:"var(--panel)","stroke-width":3},g);
    var tx=el("text",{"font-size":$("nums").checked?18:13},g);
    tx.textContent=$("nums").checked?String(i+1):Array.from(d.name)[0]||"?";
    if(!$("nums").checked||true){var nm=el("text",{y:42,"font-size":13,style:"fill:var(--text);font-weight:500"},g);nm.textContent=d.name}
  });
}
function thumb(f){
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  S.dancers.forEach(function(d){var p=f.pos[d.id];if(p)s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="30" fill="'+d.color+'"/>'});
  return s+"</svg>";
}
function drawStrip(){
  var st=$("strip");st.innerHTML="";
  S.forms.forEach(function(f,i){
    var c=document.createElement("div");c.className="fc"+(i===S.cur?" on":"");
    c.innerHTML=thumb(f)+'<div class="r"><input type="text" value="'+f.name.replace(/"/g,"&quot;")+'"></div><div class="r">開始<input type="number" min="0" step="0.5" value="'+f.t+'">秒</div>';
    c.onclick=function(){if(S.cur!==i){S.cur=i;S.time=f.t;S.scrub=false;stopPlay();refresh()}};
    var ins=c.querySelectorAll("input");
    ins[0].oninput=function(){f.name=ins[0].value;save()};
    ins[0].onclick=function(e){e.stopPropagation()};
    ins[1].onclick=function(e){e.stopPropagation()};
    ins[1].onchange=function(){
      var v=Math.max(0,parseFloat(ins[1].value)||0);
      if(i>0)v=Math.max(v,S.forms[i-1].t+0.5);
      if(i<S.forms.length-1)v=Math.min(v,S.forms[i+1].t-0.5);
      f.t=i===0?0:v;save();refresh();
    };
    st.appendChild(c);
  });
}
function drawList(){
  var l=$("dl");l.innerHTML="";
  S.dancers.forEach(function(d,i){
    var r=document.createElement("div");r.className="dr";
    r.innerHTML='<input type="color" value="'+d.color+'"><input type="text" value="'+d.name.replace(/"/g,"&quot;")+'"><button class="sm" title="削除">✕</button>';
    var q=r.querySelectorAll("input,button");
    q[0].oninput=function(){d.color=q[0].value;save();drawStage();drawStrip()};
    q[1].oninput=function(){d.name=q[1].value;save();drawStage()};
    q[2].onclick=function(){
      if(S.dancers.length<=1)return;
      S.dancers.splice(i,1);S.forms.forEach(function(f){delete f.pos[d.id]});save();refresh();
    };
    l.appendChild(r);
  });
}
function updateTime(){
  var T=total();
  $("seek").value=Math.round(S.time/T*1000);
  $("tl").textContent=S.time.toFixed(1)+"s / "+T.toFixed(1)+"s";
}
function refresh(){drawStage();drawStrip();drawList();updateTime()}

function svgPt(e){
  var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  var p=pt.matrixTransform(svg.getScreenCTM().inverse());return p;
}
svg.addEventListener("pointerdown",function(e){
  if(S.playing)return;
  var g=e.target.closest&&e.target.closest(".dancer");if(!g)return;
  var id=g.getAttribute("data-id"),p=svgPt(e),cp=S.forms[S.cur].pos[id];
  drag={id:id,dx:cp.x-p.x,dy:cp.y-p.y,g:g};
  svg.setPointerCapture(e.pointerId);e.preventDefault();
});
svg.addEventListener("pointermove",function(e){
  if(!drag)return;
  var p=svgPt(e),x=p.x+drag.dx,y=p.y+drag.dy;
  if($("snap").checked){x=snapV(x);y=snapV(y)}
  x=Math.max(MARGIN/2,Math.min(W-MARGIN/2,x));y=Math.max(MARGIN/2,Math.min(H-MARGIN/2,y));
  S.forms[S.cur].pos[drag.id]={x:x,y:y};
  drag.g.setAttribute("transform","translate("+x+","+y+")");
});
function endDrag(){if(!drag)return;drag=null;save();drawStrip()}
svg.addEventListener("pointerup",endDrag);
svg.addEventListener("pointercancel",endDrag);

function stopPlay(){stopAudio();S.playing=false;cancelAnimationFrame(raf);$("play").textContent="▶ 再生"}
function tick(ts){
  if(!S.playing)return;
  S.time=au.on?au.ctx.currentTime-au.base:(ts-t0)/1000;
  if(S.time>=total()){S.time=total();stopPlay();S.scrub=true}
  S.cur=posAt(S.time).idx;
  drawStage();updateTime();
  if(S.playing)raf=requestAnimationFrame(tick);
}
$("play").onclick=function(){
  if(S.playing){stopPlay();return}
  if(S.time>=total())S.time=0;
  S.playing=true;S.scrub=true;$("play").textContent="⏸ 停止";
  t0=performance.now()-S.time*1000;startAudio(S.time);raf=requestAnimationFrame(tick);
};
$("seek").oninput=function(){
  stopPlay();S.scrub=true;S.time=$("seek").value/1000*total();
  S.cur=posAt(S.time).idx;drawStage();drawStrip();updateTime();
};
function leaveScrub(){S.scrub=false}
svg.addEventListener("pointerdown",function(){if(S.scrub&&!S.playing){S.scrub=false;S.time=S.forms[S.cur].t;drawStage();updateTime()}},true);

$("addD").onclick=function(){
  var n=S.dancers.length,d={id:nid(),name:"メンバー"+(n+1),color:COLORS[n%COLORS.length]};
  S.dancers.push(d);
  S.forms.forEach(function(f){f.pos[d.id]={x:W/2+(n%5)*40-80,y:60}});
  save();refresh();
};
$("addF").onclick=function(){newForm(false)};
$("dupF").onclick=function(){newForm(true)};
function newForm(copy){
  var last=S.forms[S.cur],pos={};
  S.dancers.forEach(function(d,i){pos[d.id]=copy||true?Object.assign({},last.pos[d.id]):{x:0,y:0}});
  var nextT=S.cur<S.forms.length-1?(last.t+S.forms[S.cur+1].t)/2:last.t+4;
  nextT=Math.round(nextT*2)/2;
  if(S.cur<S.forms.length-1&&nextT<=last.t)nextT=last.t+0.5;
  S.forms.splice(S.cur+1,0,{name:"隊形"+(S.forms.length+1),t:nextT,pos:pos});
  S.cur++;S.time=nextT;S.scrub=false;save();refresh();
}
$("delF").onclick=function(){
  if(S.forms.length<=1)return;
  S.forms.splice(S.cur,1);S.forms[0].t=0;S.cur=Math.max(0,S.cur-1);S.time=S.forms[S.cur].t;save();refresh();
};
$("preset").onchange=function(){
  var k=$("preset").value;if(!k)return;
  var f=S.forms[S.cur];
  if(k==="flipx"||k==="flipy"){S.dancers.forEach(function(d){var q=f.pos[d.id];if(q){if(k==="flipx")q.x=snapV(W-q.x);else q.y=snapV(H-q.y)}});$("preset").value="";save();refresh();return}
  var p=layout(k,S.dancers.length);
  S.dancers.forEach(function(d,i){f.pos[d.id]={x:snapV(p[i].x),y:snapV(p[i].y)}});
  $("preset").value="";save();refresh();
};
$("snap").onchange=$("ghost").onchange=$("nums").onchange=function(){drawStage()};
$("exp").onclick=function(){
  var s=JSON.stringify({dancers:S.dancers,forms:S.forms});
  var t=prompt("この文字列をコピーして保存してください",s);
};
$("imp").onclick=function(){
  var s=prompt("書き出した文字列を貼り付けてください");if(!s)return;
  try{var j=JSON.parse(s);if(!j.dancers||!j.forms)throw 0;S.dancers=j.dancers;S.forms=j.forms;S.cur=0;S.time=0;S.scrub=false;save();refresh()}catch(e){alert("読み込めませんでした")}
};
$("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
function stopAudio(){if(au.src){try{au.src.stop()}catch(e){}au.src=null}au.on=false}
function startAudio(at){
  stopAudio();
  if(!au.buf||at>=au.buf.duration)return;
  if(au.ctx.state==="suspended")au.ctx.resume();
  var s=au.ctx.createBufferSource();s.buffer=au.buf;s.connect(au.ctx.destination);
  s.start(0,at);au.src=s;au.base=au.ctx.currentTime-at;au.on=true;
}
$("aBtn").onclick=function(){$("aFile").click()};
$("aFile").onchange=function(){
  var f=$("aFile").files[0];if(!f)return;
  $("aName").textContent="読み込み中…";
  try{if(!au.ctx){var AC=window.AudioContext||window.webkitAudioContext;au.ctx=new AC()}}catch(e){$("aName").textContent="音声を再生できない環境です";return}
  f.arrayBuffer().then(function(b){return new Promise(function(res,rej){au.ctx.decodeAudioData(b,res,rej)})}).then(function(buf){
    stopPlay();au.buf=buf;au.dur=buf.duration;
    $("aName").textContent="🎵 "+f.name+"（"+buf.duration.toFixed(1)+"s）";updateTime();
  }).catch(function(){$("aName").textContent="この音声は読み込めませんでした"});
};
$("addHere").onclick=function(){
  stopPlay();
  var T=Math.round(S.time*10)/10,f=S.forms,i=0;
  while(i<f.length&&f[i].t<=T)i++;
  if(i>0&&T-f[i-1].t<0.3){S.cur=i-1;S.time=f[i-1].t;S.scrub=false;refresh();return}
  var src=posAt(T).pos,pos={};
  S.dancers.forEach(function(d){var p=src[d.id];pos[d.id]={x:$("snap").checked?snapV(p.x):Math.round(p.x),y:$("snap").checked?snapV(p.y):Math.round(p.y)}});
  f.splice(i,0,{name:"隊形"+(f.length+1),t:T,pos:pos});
  S.cur=i;S.time=T;S.scrub=false;save();refresh();
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cell(f,idx,ox,oy){
  var CH=H+70,s='<g transform="translate('+ox+','+oy+')"><rect width="'+W+'" height="'+CH+'" fill="#fff"/>';
  s+='<text x="20" y="44" font-size="30" font-weight="700" fill="#1d2433">'+(idx+1)+'. '+esc(f.name)+'  <tspan font-size="22" fill="#6b7488">'+f.t+'s</tspan></text><g transform="translate(0,70)"><rect width="'+W+'" height="'+H+'" fill="#fdfdff" stroke="#dfe3ee" stroke-width="2"/>';
  var x,y;
  for(x=GRID;x<W;x+=GRID)s+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="#e6e9f3"/>';
  for(y=GRID;y<H;y+=GRID)s+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#e6e9f3"/>';
  s+='<line x1="500" y1="0" x2="500" y2="'+H+'" stroke="#6c5ce7" stroke-opacity=".35" stroke-dasharray="6 6"/><text x="500" y="'+(H-8)+'" text-anchor="middle" font-size="16" fill="#6b7488">▼ 客席（フロント） ▼</text>';
  S.dancers.forEach(function(d,i){var p=f.pos[d.id];if(!p)return;
    s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="26" fill="'+d.color+'" stroke="#fff" stroke-width="3"/><text x="'+p.x+'" y="'+p.y+'" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">'+esc($("nums").checked?i+1:(Array.from(d.name)[0]||"?"))+'</text><text x="'+p.x+'" y="'+(p.y+44)+'" font-size="15" fill="#1d2433" text-anchor="middle">'+esc(d.name)+'</text>';
  });
  return s+'</g></g>';
}
function exportImg(all){
  var items=all?S.forms:[S.forms[S.cur]],cols=items.length>1?2:1,rows=Math.ceil(items.length/cols),CH=H+70,w=cols*W,h=rows*CH;
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" font-family="Hiragino Sans,Noto Sans JP,Yu Gothic,sans-serif">';
  items.forEach(function(f,k){s+=cell(f,all?k:S.cur,(k%cols)*W,Math.floor(k/cols)*CH)});
  s+='</svg>';
  var img=new Image();
  img.onload=function(){
    var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    c.toBlob(function(b){ov={blob:b,name:all?"formations.png":"formation-"+(S.cur+1)+".png"};$("ovImg").src=c.toDataURL("image/png");$("ovMsg").textContent="画像を長押し（右クリック）でも保存できます";$("ov").className="on"},"image/png");
  };
  img.onerror=function(){alert("画像の生成に失敗しました")};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}
$("imgB").onclick=function(){exportImg(false)};
$("imgA").onclick=function(){exportImg(true)};
$("ovClose").onclick=function(){$("ov").className=""};
$("ovSave").onclick=function(){
  var p=(window.claude&&window.claude.use)?window.claude.use("downloads"):Promise.resolve(null);
  p.then(function(d){
    if(!d||!ov.blob){$("ovMsg").textContent="画像を長押し（右クリック）して保存してください";return}
    return d.save({filename:ov.name,data:ov.blob}).then(function(){$("ovMsg").textContent="保存しました"});
  }).catch(function(e){if(!e||e.code!=="declined")$("ovMsg").textContent="保存できませんでした。画像を長押しで保存してください"});
};
init();refresh();
})();
</script>
</body>
</html>
